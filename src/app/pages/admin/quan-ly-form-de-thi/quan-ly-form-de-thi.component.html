<div class="intro-y">
  <div>
    <div class="layout_component_container intro-x">
      <div *ngIf="!isLoading; else tableLoading" class="scroll-table-layout-set">
        <ovic-table
          emptyMessage="Danh sách trống"
          [index]="index"
          [data]="listData"
          styleClass="table-scroll-able table-able-dropdown table-reBorder"
          dataKey="id"
          rowHover="true"
          [rows]="10"
          tableName="Danh sách form đề thi"
          [tblStructure]="tblStructure"
          [enableSearch]="true"
          (onButtonClick)="handleClickOnTable($event)"
          [enableSearchLocal]="false"
          (onSearch)="onSearch($event)"
          [searchDebounceTime]="800"
          [headerButtons]="headButtons"
        >
        </ovic-table>
      </div>

      <ng-template #tableLoading>
        <app-table-loader [tableCol]="6" [tableRow]="7"></app-table-loader>
      </ng-template>
      <div class="page-layout-set">
        <p-paginator
          [rows]="rows"
          [totalRecords]="recordsTotal"
          [pageLinkSize]="5"
          (onPageChange)="paginate($event)"
        >
        </p-paginator>
      </div>
    </div>
  </div>
</div>

<ng-template #templateChooseCode let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title">Chọn đề thi</h4>
    <button
      (click)="closeDialog()"
      pButton
      pRipple
      type="button"
      icon="pi pi-times"
      class="p-button-rounded p-button-danger p-button-text close ovic-side-navigation-content__head__btn-close"
    ></button>
  </div>
  <div class="ovic-side-navigation-content__body ovic-scroll-style">
    <div class="ovic-form-layout">
      <div class="ovic-input-item">
        <p-pickList
          styleClass="tn-pickList-bank-question"
          [source]="sourceProducts"
          [target]="targetProducts"
          sourceHeader="Chưa chọn"
          targetHeader="Đã chọn"
          [dragdrop]="true"
          [showSourceControls]="false"
          [showTargetControls]="false"
          (onMoveToTarget)="onMoveToTargetNew($event)"
          (onMoveToSource)="onMoveToSourceNew($event)"
          [responsive]="true"
          [sourceStyle]="{ height: '300px' }"
          [targetStyle]="{ height: '300px' }"
          filterBy="question_number,id,code"
          sourceFilterPlaceholder="Tìm kiếm theo part hoặc id"
          targetFilterPlaceholder="Tìm kiếm theo code hoặc id"
        >
          <ng-template let-product pTemplate="item">
            <div class="product-item">
              <div class="product-list-detail">
                <span>{{
                  "[#" + product.id + " - " + product.question_number + "]"
                }}</span>
                <span>{{
                  product["code"] ? "(" + product["code"] + ")" : ""
                }}</span>
              </div>
            </div>
          </ng-template>
        </p-pickList>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <!-- <p class="ovic-form-notes ovic-over-right-section__foot-ovic-input-line">
            <i class="pi pi-info-circle"></i>Không chọn đề nào có nghĩa là chọn tất cả
        </p> -->
    <button (click)="closeDialog()" type="button" class="btn btn-primary">
      <i class="fa fa-floppy-o mr-2" ></i>Lưu lại
    </button>
  </div>
</ng-template>
