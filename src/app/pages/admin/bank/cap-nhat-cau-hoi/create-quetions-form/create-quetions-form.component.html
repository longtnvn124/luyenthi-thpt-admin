<div class="create-edit-question-section ovic-is-loading--size-normal d-flex flex-column h-100" [class.ovic-is-loading]="loading">
	<div class="row" *ngIf="formMode === 'create'">
		<div class="col-4">
			<div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
				<div class="form-row mt-2 --disabled">
					<label>Dạng vận dụng <span class="ovic-mark">*</span></label>
					<p-dropdown class="input-element ovic-dropdown-style" [filter]="false" [options]="vandungTypes" [(ngModel)]="vandungTypeSelect" (ngModelChange)="changesVandungType()" optionLabel="label" optionValue="value" optionDisabled="disable" [placeholder]="'-- Chọn dạng vận dụng --'"></p-dropdown>
				</div>
			</div>
		</div>

		<div [ngClass]="testFormat === 'tienganh' ? 'col-4' : 'col-8'">
			<div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
				<p class="form-row mt-2">
					<label>Loại câu hỏi <span class="ovic-mark">*</span></label>
					<p-dropdown class="input-element ovic-dropdown-style" [filter]="true" [options]="questionTypeSection.options" [(ngModel)]="questionTypeSection.active" (ngModelChange)="changesQuestionType()" optionLabel="label" optionValue="value" optionDisabled="disable" [placeholder]="questionTypeSection.placeholder"></p-dropdown>
				</p>
			</div>
		</div>
		<div class="col-4" *ngIf="testFormat === 'tienganh'">
			<form [formGroup]="form">
				<div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
					<p class="form-row mt-2">
						<label for="code">Mã ngân hàng đề</label>
						<input id="code" class="ovic-input-field" formControlName="code" placeholder="code"/>
					</p>
				</div>
			</form>
		</div>
	</div>

	<div class="question-preview flex-fill ovic-scroll-style overflow-hidden overflow-y-auto h-100" *ngIf="f['question_type'].value; else emptyMessage">
		<div class="question-preview__container">
			<div class="question-preview__question" [ngClass]="testFormat === 'tienganh' ? 'question-preview__question--layout-separator' : 'question-preview__question--layout-linear'">
				<div class="question-preview__question__direction">
					<div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2" *ngIf=" testFormat === 'tienganh' && formMode === 'update' && question.group_id === 0">
						<p class="form-row mb-2">
							<label>Mã ngân hàng đề</label>
							<input class="ovic-input-field" [(ngModel)]="question.code" placeholder="code"/>
						</p>
					</div>
					<div class="question-preview__question__size">
						<b class="question-preview__question__direction__prefix"> CÂU HỎI:</b>
						<div class="question-preview__question__direction__content">
							<ng-container *ngIf="_typeForm == 'edit'">
								<app-input-question-direction [triggerFromParent]="triggerInputQuestionDirection" [abstractControl]="f['question_direction']" [defaunt]="f['question_direction'].value" (ckEditor)="ckEditorSetup($event)"></app-input-question-direction>
							</ng-container>

							<ng-container *ngIf="_typeForm == 'add' ">
								<app-input-question-direction [triggerFromParent]="triggerInputQuestionDirection" [abstractControl]="f['question_direction']" [defaunt]="f['question_direction'].value" (ckEditor)="ckEditorSetup($event)"></app-input-question-direction>
							</ng-container>
							<!--                            <ovic-ckeditor-document [formField]="f['question_direction']"></ovic-ckeditor-document>-->
							<!--                            <ovic-ckeditor-document [abstractControl]="f['question_direction']"-->
							<!--                                                    (ckEditor)="ckEditorSetup($event)"></ovic-ckeditor-document>-->
							<ng-container *ngIf="testFormat === 'tienganh'">
								<div class="question-preview__question__direction__content__media" *ngIf="question.media; else showBtnImportMedia">
									<div class="question-preview__question__direction__content__block">
										<span class="question-preview__question__direction__content__label">File nghe:</span>
										<audio controls>
											<source [src]="question.media.path | ictuMediaLink : question.media.source : token | safeUrl"/>
										</audio>
									</div>
									<div class="question-preview__question__direction__content__block">
										<span class="question-preview__question__direction__content__label">Giới hạn số lượt nghe của sinh viên:</span>
										<input placeholder="Số lượt được nghe của sinh viên" type="text" pInputText [(ngModel)]="question.media.replay" (keyup)="validateInputMediaReplay()"/>
										<small class="text-secondary">Vui lòng nhập giá trị số.</small>
									</div>
								</div>
								<ng-template #showBtnImportMedia>
									<!--                                    <button (click)="btnImportQuestionMedia()"-->
									<!--                                            class="question-preview__question__direction__content__media__button" pRipple-->
									<!--                                            pButton icon="fa fa-headphones" label="Nhập file nghe"></button>-->
								</ng-template>
							</ng-container>
						</div>
						<div *ngIf="(question.question_type =='drag_drop' || question.question_type =='group-radio') && question.children.length > 0" class="config-type-input">
							<!-- apply for drag and drop question type -->
							<p-tabMenu [model]="menusInputType" [activeItem]="menuActiveItem"/>
						</div>
						<div class="question-preview__question__list-answer-options 123" *ngIf="question && ['drag_drop', 'grouping'].includes(question.question_type) && question.answer_option && question.answer_option.length">
							<span class="question-preview__question__list-answer-options__text lock-ck-content lock-ck-content-p-mb-0" *ngFor="let option of question.answer_option; index as i" [IctuMediaLoader]="changeAnswerMedia" [innerHTML]="option.value | safeHtml"></span>
						</div>
					</div>
				</div>
				<div class="question-preview__question__answer">
					<ng-container *ngIf="testFormat !== 'tienganh'; else inputTypeEnglish">
						<div class="question-preview__question__size">
							<ng-container [ngSwitch]="f['question_type'].value">
								<group-input-question *ngSwitchCase="'group-input'" [question]="question" [confirmOnDelete]="formMode === 'update'"></group-input-question>
								<div *ngSwitchCase="'input'" class="w-100">
									<input type="text" pInputText placeholder="Đáp án" class="group-input-question__option__input w-100" [(ngModel)]="questionAnswer" (ngModelChange)="updateAnswerTypeInput()"/>
								</div>
								<ng-container *ngSwitchCase="'group-radio'">

									<group-radio-question-editor *ngIf="question.config.typeInput == 'editor'; else groupRadioText" [question]="question" [confirmOnDelete]="formMode === 'update'"></group-radio-question-editor>
									<ng-template #groupRadioText>
										<group-radio-question

											[question]="question" [confirmOnDelete]="formMode === 'update'"></group-radio-question>
									</ng-template>
								</ng-container>
								<ng-container *ngSwitchCase="'drag_drop'">
									<drag-and-drop-question-ck-editor *ngIf="question.config.typeInput == 'editor'; else drapdropText" [question]="question" [confirmOnDelete]="formMode === 'update'" (changeAnswerImage)="changeAnswerImage()"></drag-and-drop-question-ck-editor>


									<ng-template #drapdropText>
										<drag-and-drop-question

											[question]="question" [confirmOnDelete]="formMode === 'update'"></drag-and-drop-question>
									</ng-template>

								</ng-container>


								<question-type-radio-editor *ngSwitchCase="'checkbox'" [multiple]="true" [question]="question"></question-type-radio-editor>
								<question-type-radio-editor *ngSwitchCase="'radio'" [multiple]="false" [question]="question"></question-type-radio-editor>
								<grouping-question *ngSwitchCase="'grouping'" [question]="question"></grouping-question>
								<ng-container *ngSwitchCase="'inputbox'"></ng-container>
								<ng-container *ngSwitchCase="'reorder_words'">
									<!-- <question-type-reorder-words
									  *ngSwitchCase="'reorder_words'"
									  [question]="child"
									></question-type-reorder-words> -->
								</ng-container>
								<ng-container *ngSwitchCase="'matching'"></ng-container>
								<ng-container *ngSwitchCase="'group'">
									<div class="pt-2" *ngFor="let item of numberQuestionChildrenGroup; index as i">
										<div class="d-flex align-items-center justify-content-between pb-3">
											<!-- <small class="list-questions__contents__block__code"
											  >Câu {{ i + 1 }}</small
											> -->
											<!-- <button
											  pButton
											  pRipple
											  icon="pi pi-trash"
											  class="group-input-question__option__btn-remove p-button-danger p-button-rounded p-button-text p-button-outlined"
											  (click)="deleteQuestionChildrenGroup(i)"
											></button> -->
										</div>
										<app-group-question [prefix]="i+1" [typeForm]="_typeForm" [testFormat]="'monkhac'" [vanDungSelected]="parent_vandung_type" [data]="info" [parent_id]="parent_id_saved" [parent_already_emit_change]="parent_already_emit_change" (checkChildAlreadyToSave)="
                        handleChildAlreadyToSave($event, i)
                      " (childQuestionSaved)="handleChildQuestionSaved($event)" (deleteQuestionChildrenGroup)="deleteQuestionChildrenGroup($event,i)"></app-group-question>
									</div>

									<div class="mt-2">
										<button (click)="addChildQuestionTypeGroup()" class="typical-question__btn-add w-100">
											<i class="pi pi-plus-circle"></i>Thêm câu hỏi
										</button>
									</div>
								</ng-container>
								<div *ngSwitchDefault class="d-flex flex-fill w-100 h-100 justify-content-center align-items-center">
									<p class="alert alert-secondary m-0 primary-font --fs-14">
										Vui lòng chọn loại câu hỏi </p>
								</div>
							</ng-container>
							<div></div>
							<div class="question-preview__question__size__foot">
								<button [disabled]="
                     !availableToSave
                  " (click)="btnSaveQuestion()" pButton pRipple icon="pi pi-save" class="question-preview__question__size__foot__button p-button--center p-button-success" label="Lưu lại"></button>
								<button *ngIf="question && question['status'] === -1" [disabled]="!availableToSave" (click)="saveQuestion(true)" pButton pRipple icon="pi pi-save" class="question-preview__question__size__foot__button p-button--center p-button-success" label="Lưu lại và yêu cầu duyệt"></button>
								<!--<button [disabled]="!availableToSave" (click)="saveQuestion()" pButton pRipple icon="pi pi-save" class="question-preview__question__size__foot__button p-button&#45;&#45;center" label="Lưu lại và xem"></button>-->
							</div>
						</div>
					</ng-container>
					<ng-template #inputTypeEnglish>
						<ng-container *ngIf="question.question_type !== 'drag_drop'; else dragAndDropInEnglish">
							<!-- <div>{{loadTest()}}</div> -->
							<div class="question-preview__question__size position-relative" *ngFor="let child of question.children; index as i">
								<button (click)="removeChildQuestion(i)" pButton pRipple icon="pi pi-trash" class="question-preview__question__size__btn-remove-child-question p-button-danger"></button>
								<div class="row" *ngIf="!['inputbox', 'reorder_words'].includes(child.question_type)">
									<div class="col-12">
										<div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
											<p class="form-row mt-0">
												<label for="question_number">Câu hỏi số</label>
												<input id="question_number" class="ovic-input-field" [(ngModel)]="child.question_number"/>
											</p>
										</div>
									</div>
									<div class="col-12">
										<div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
											<p class="form-row mb-5">
												<label for="question_number">Nội dung câu hỏi
													<span class="ovic-mark">*</span></label>
												<textarea rows="2" [autoResize]="true" pInputTextarea class="ovic-input-field" [(ngModel)]="child.question_direction"></textarea>
											</p>
										</div>
									</div>
								</div>
								<ng-container [ngSwitch]="child.question_type">
									<group-input-question *ngSwitchCase="'group-input'" [question]="child"></group-input-question>
									<group-radio-question-editor *ngSwitchCase="'group-radio'" [question]="child"></group-radio-question-editor>
									<question-type-radio-editor *ngSwitchCase="'checkbox'" [multiple]="true" [question]="child"></question-type-radio-editor>
									<question-type-radio-editor *ngSwitchCase="'radio'" [multiple]="false" [question]="child"></question-type-radio-editor>
									<drag-and-drop-question *ngSwitchCase="'drag_drop'" [question]="child"></drag-and-drop-question>
									<grouping-question *ngSwitchCase="'grouping'" [question]="child"></grouping-question>
									<question-type-input-box *ngSwitchCase="'inputbox'" [question]="child"></question-type-input-box>
									<question-type-reorder-words *ngSwitchCase="'reorder_words'" [question]="child"></question-type-reorder-words>
									<ng-container *ngSwitchCase="'matching'"></ng-container>
									<div *ngSwitchDefault class="d-flex flex-fill w-100 h-100 justify-content-center align-items-center">
										<p class="alert alert-secondary m-0 primary-font --fs-14">
											Vui lòng chọn loại câu hỏi </p>
									</div>
								</ng-container>
							</div>

							<!--                            <div class="question-preview__question__size">-->
							<!--                                <div class="question-type-radio__footer d-flex justify-content-between align-items-center">-->
							<!--                                    <p-checkbox [(ngModel)]="question.config.invertedAnswer" [binary]="true" label="Đảo vị trí của các câu hỏi"></p-checkbox>-->
							<!--                                    <button (click)="addMoreChildQuestion()" class="typical-question__btn-add">-->
							<!--                                        <i class="pi pi-plus-circle"></i>Thêm câu hỏi-->
							<!--                                    </button>-->
							<!--                                </div>-->
							<!--                            </div>-->
						</ng-container>

						<ng-template #dragAndDropInEnglish>
							<div class="question-preview__question__size">
								<drag-and-drop-question [question]="question" [enableQuestionNumber]="true"></drag-and-drop-question>
							</div>
						</ng-template>

						<div class="question-preview__question__size">
							<div class="question-type-radio__footer d-flex justify-content-between align-items-center" *ngIf="question.question_type !== 'drag_drop'">
								<p-checkbox [(ngModel)]="question.config.invertedAnswer" [binary]="true" label="Đảo vị trí của các câu hỏi"></p-checkbox>
								<button (click)="addMoreChildQuestion()" class="typical-question__btn-add">
									<i class="pi pi-plus-circle"></i>Thêm câu hỏi
								</button>
							</div>
							<div class="question-preview__question__size__foot" [class.p-0]="question.question_type === 'drag_drop'">
								<button [disabled]="!availableToSave" (click)="saveQuestion()" pButton pRipple icon="pi pi-save" class="question-preview__question__size__foot__button p-button--center p-button-success" label="Lưu lại"></button>
								<!--<button [disabled]="!availableToSave" (click)="saveQuestion()" pButton pRipple icon="pi pi-save" class="question-preview__question__size__foot__button p-button&#45;&#45;center" label="Lưu lại và xem"></button>-->
							</div>
						</div>
					</ng-template>
				</div>
			</div>
		</div>
	</div>
</div>
<ng-template #emptyMessage>
	<div class="create-edit-question-section__panel d-flex flex-fill flex-column">
		<p class="alert alert-secondary m-0 primary-font --fs-14">
			{{ guideMessages }} </p>
	</div>
</ng-template>
