<div class="group-input-question" *ngIf="question">
	<ul class="group-input-question__list" *ngIf="childQuestion && childQuestion.length">
		<li class="group-input-question__list__element" [ngClass]="'group-input-question__list__element--size-'+question.config.cols" *ngFor="let q of childQuestion; index as i">
			<div class="group-radio-question__block" *ngIf="!isPresent; else onlyPresentMode">
				<div class="group-radio-question__block__head">
					<app-input-question-direction [htmlInputModel]="childQuestionsDirection[i]" (editorContentEmit)="editorContentChange($event,i)"></app-input-question-direction>
					<div class="mt-1">
						<input type="text" pInputText placeholder="Đáp án" class="group-input-question__option__input" [(ngModel)]="q.answer" (ngModelChange)="updateAnswer(q)">
					</div>
				</div>
				<button (click)="deleteAnswer(i)" pButton pRipple icon="pi pi-trash" class="group-input-question__option__btn-remove p-button-danger p-button-rounded p-button-text p-button-outlined"></button>
			</div>
			<ng-template #onlyPresentMode>
				<div class="group-radio-question__block group-radio-question__block--only-present">
					<div class="group-radio-question__block__head">
						<div class="d-flex group-input-question__option__input group-input-question__option__input--bold">
							<span class="mr-1">{{ 1 + i }}) </span>
							<span [IctuMediaLoader]="i" [innerHTML]="q.question.question_direction | safeHtmlSingle">
                            </span>
						</div>
						<input [disabled]="true" type="text" pInputText placeholder="Đáp án" class="group-input-question__option__input" [(ngModel)]="q.answer">
					</div>
				</div>
			</ng-template>
		</li>
	</ul>
	<div class="group-input-question__footer d-flex justify-content-between align-items-center" *ngIf="!isPresent">
		<small class="group-input-question__note text-left text-secondary">Trường hợp câu hỏi có nhiều đáp án đúng, thì các đáp án được phân cách nhau
			<br>bởi dấu chấm phẩy( ";") và không phân biệt chữ hoa, chữ thường. Ví dụ : 1; one; first</small>
		<div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2">
			<p class="form-row mt-0">
				<p-dropdown class="input-element ovic-dropdown-style" [filter]="false" [options]="colOptions" [(ngModel)]="question.config.cols" optionLabel="label" optionValue="value" optionDisabled="disable" placeholder="--Lựa chọn--"></p-dropdown>
			</p>
		</div>
		<button (click)="addMoreAnswerOption()" class="typical-question__btn-add">
			<i class="pi pi-plus-circle"></i>Thêm câu hỏi
		</button>
	</div>
</div>
