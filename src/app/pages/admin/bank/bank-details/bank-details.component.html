<div class="ictu-admin-side-layout">
	<div class="ictu-admin-side-layout__side ictu-admin-side-layout__side--left">
		<div class="ictu-admin-side-layout__head">
			<div class="ictu-admin-side-layout__container d-flex justify-content-center align-items-center h-100 w-100 position-relative">
				<input [(ngModel)]="search" class="ictu-admin-side-layout__head__input w-100" pInputText placeholder="Tìm kiếm..." type="text" (keyup.enter)="onSearchData()" style="border: none;padding-inline: 5px;">
				<div *ngIf="state() === 'loading'" class="animation-typing-dots w-100 h-100" style="position: absolute;z-index: 5;top: 0;left: 0;background-color: rgb(255 255 255 / 61%);">
					<div class="animation-typing-dots__element"></div>
					<div class="animation-typing-dots__element"></div>
					<div class="animation-typing-dots__element"></div>
				</div>
			</div>
		</div>
		<div class="ictu-admin-side-layout__body position-relative">
			<div *ngIf="state() === 'loading'" class="dashboard-component__loading h-100">
				<div class="dashboard-component__loading__content dashboard-component__loading__content--hide-background">
					<h4 class="dashboard-component__loading__heading">Loading...</h4>
					<mat-progress-bar mode="indeterminate" value="40"></mat-progress-bar>
				</div>
			</div>
			<ng-container [ngSwitch]="state()">
				<div *ngSwitchCase="'empty'" class="d-flex justify-content-center align-items-center w-100 h-100">
					<div class="alert alert-primary ictu-alert-notice">Không có dữ liệu!</div>
				</div>
				<div *ngSwitchCase="'error'" class="d-flex justify-content-center align-items-center w-100 h-100" style="padding: 10px;">
					<div class="alert alert-danger ictu-alert-notice m-0 border-0" style="padding: 10px;">
						Quá trình tải dữ liệu bị gián đoạn!. <a href="javascript:" (click)="reload($event)">tải lại</a>
					</div>
				</div>
				<div *ngSwitchDefault class="ictu-admin-side-layout__body bank-imports-side d-flex flex-column">
					<div class="bank-imports-side__body ovic-scroll-style">
						<div *ngIf="dataTable.data().length" class="ictu-admin-side-layout__container">
							<ul class="bank-imports-side__banks">
								<ng-container *ngFor="let row of dataTable.data(); index as i; trackBy:identify">
									<li class="bank-imports-side__banks__elm" [ngClass]="row.selected ? '--selected':''">
										<!-- <button *ngIf="!row.hasChildren" (click)="selectBank(row,row)" class="bank-imports-side__banks__btn" type="button"> -->
										<button *ngIf="!row.hasChildren" (click)="alertBankEmptyChild()" class="bank-imports-side__banks__btn" type="button">
											<h4 class="bank-imports-side__banks__btn__label">{{ row.name }}</h4>
										</button>
										<ng-container *ngIf="row.hasChildren">
											<button (click)="collapse.panel.toggle()" class="bank-imports-side__banks__btn" type="button">
												<h4 class="bank-imports-side__banks__btn__label">{{ row.name }}</h4>
												<i class="pi pi-angle-down" [ngClass]="collapse.panel.isShown ? 'fa-rotate-180':''"></i>
											</button>
											<collapse-panel #collapse [id]="row.id.toString(10)">
												<ul class="bank-imports-side__banks__child">
													<li class="bank-imports-side__banks__child__elm" *ngFor="let child of row.children; index as i; trackBy:identifyChild">
														<button (click)="selectBank(row,child)" class="bank-imports-side__banks__child__elm__btn d-flex justify-content-between align-items-center" type="button" [ngClass]="(activeBank()?.id === child.id) ? '--selected':''">
															<h4 style="max-width: calc(100% - 20px);" class="bank-imports-side__banks__btn__label">{{ child.name }}</h4>
															<span *ngIf="child.status === 1" class="ictu-badge ictu-badge--success" style="padding: 0;line-height: 0;background-color: transparent;">
																<i style="width: 16px;height: 16px;" class="pi-verified pi"></i>
															</span>
															<span *ngIf="child.status !== 1" class="ictu-badge ictu-badge--secondary" style="padding: 0;line-height: 0;background-color: transparent;">
																<i style="width: 16px;height: 16px;" class="pi-file-edit pi"></i>
															</span>
														</button>
													</li>
												</ul>
											</collapse-panel>
										</ng-container>
									</li>
								</ng-container>
							</ul>
						</div>
					</div>
					<div class="bank-imports-side__foot d-flex justify-content-center align-items-center w-100">
						<ictu-paginator [control]="dataTable.paginator" (onChangePage)="onChangePage($event)"></ictu-paginator>
					</div>
				</div>
			</ng-container>
		</div>
	</div>
	<div class="ictu-admin-side-layout__side ictu-admin-side-layout__side--right">
		<ng-container *ngIf="activeBank(); else emptySelectBank">
			<ng-container [ngSwitch]="activeBank().format">
				<app-bank-questions *ngSwitchCase="'standard'" [bankId]="activeBank().id" format="standard" [bankName]="this.activeBankName()"></app-bank-questions>
				<app-bank-english-questions *ngSwitchCase="'english'" [bankId]="activeBank().id" format="english" [bankName]="this.activeBankName()"></app-bank-english-questions>
			</ng-container>
		</ng-container>
	</div>
</div>
<ng-template #emptySelectBank>
	<div class="d-flex justify-content-center align-items-center w-100 h-100">
		<div class="alert alert-primary ictu-alert-notice">Chọn ngân hàng trước.</div>
	</div>
</ng-template>
