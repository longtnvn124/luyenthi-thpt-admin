<div class="card-stat stat-revenue">
    <div class="row">
        <div class="col-6">
            <div class="img">
                <img src="/assets/images/svg/free_icon_card.svg" alt="">
            </div>
        </div>

        <div class="col-6">
            <div class="title">
                Doanh thu
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-6">
            <div class="value">
                <ng-container *ngIf="data != null; else loading">
                    <!-- <span [countUp]="data" [duration]="3000"></span> <span style="margin-left: 2px; font-size: 0.8rem;">₫</span> -->
                    <span>{{data | numberFormat}}</span> <span style="margin-left: 2px; font-size: 0.8rem;">₫</span>
                </ng-container>
                  <ng-template #loading>
                    <i class="pi pi-spin pi-spinner loading-point"></i>
                  </ng-template>
            </div>
        </div>
        <div class="col-6">
            <div class="chart">
                <apx-chart [series]="totalTasksChart.series!" [chart]="totalTasksChart.chart!" [colors]="['#7a0916']" [stroke]="totalTasksChart.stroke!" [fill]="totalTasksChart.fill!"></apx-chart>
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-6">
            <div class="value">
                100,000
            </div>
        </div>
        <div class="col-6">
            <div class="chart">

            </div>
        </div>
    </div>

    <span class="bg-stat">
    
    </span>
</div>
