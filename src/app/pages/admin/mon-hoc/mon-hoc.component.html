<section class="dashboard-component--full-height position-relative">
	<div class="admin-section--table position-relative">
		<div class="admin-wrap-table">
			<ng-container *ngIf="state() !== 'error'; else errorTemplate">
				<div class="admin-wrap-table__head d-flex">
					<h4 class="admin-wrap-table__heading">
						<svg>
							<use href="assets/fonts/custom-icon.svg#custom-folder-open-2"></use>
						</svg>
						Danh sách môn học
					</h4>
					<div class="admin-wrap-table__head-actions">
						<input [(ngModel)]="search" class="admin-wrap-table__head-actions__search" pInputText placeholder="Tìm kiếm..." type="text" (keyup.enter)="onSearchData()">
						<button *ngIf="userCanDelete()" (click)="deleteSelectedRows()" [disabled]="!dataTable.someItemsChecked()" class="btn p-0 ictu-button-danger-gradient" mat-flat-button>
							<i class="ti ti-trash"></i>
						</button>
						<button *ngIf="userCanCreate()" (click)="addNewItem()" mat-flat-button class="btn p-0 ictu-badge-btn--success-reverse">
							<i class="ti ti-plus"></i>
						</button>
					</div>
				</div>
			</ng-container>

			<div class="admin-wrap-table__body">
				<table class="tbl admin-table table-hover">
					<thead>
						<tr>
							<th class="col-checkbox">
								<mat-checkbox [checked]="dataTable.totalChecked()" [indeterminate]="dataTable.partiallyChecked()" (change)="dataTable.selectRow($event.checked)" [disabled]="!dataTable.data().length || !userCanDelete()"></mat-checkbox>
							</th>
							<th class="col-index text-center">#</th>
							<th>Tên môn học</th>
							<th class="text-center">Mô tả</th>
							<th class="wid-120 text-center">Trạng thái</th>
							<th class="wid-90 text-center px-0">Hành động</th>
						</tr>
					</thead>
					<tbody>
						<tr *ngFor="let row of dataTable.data(); index as i; trackBy:identify ">
							<td class="col-checkbox">
								<mat-checkbox [checked]="!!row['_ictuDataTableRowChecked']" (change)="dataTable.selectRow($event.checked, i)" [disabled]="!permissionControl().canDelete"></mat-checkbox>
							</td>
							<td class="col-index text-center">{{ dataTable.paginator.startIndex() + i }}</td>
							<td>{{ row.name }}<!-- <span class="d-block m-0 text-secondary">{{ row.slug }}</span> --></td>
							<td class="text-left">{{ row.desc }}</td>
							<td class="wid-120 text-center p-0">
								<div class="d-flex w-100 h-100 justify-content-center align-items-center">
									<span *ngIf="row.status ; else inActiveTpl" class="ictu-badge ictu-badge--success">Kích hoạt</span>
								</div>
							</td>
							<td class="p-0 wid-90">
								<div *ngIf="userCanUpdate() || userCanDelete()" class="admin-table__btn-actions">
									<button *ngIf="userCanUpdate()" (click)="editRow(row)" class="btn ictu-button-info-light">
										<i class="ti ti-edit"></i>
									</button>
									<button *ngIf="userCanDelete()" (click)="deleteRow(row)" class="btn ictu-button-danger-light">
										<i class="ti ti-trash"></i>
									</button>
								</div>
							</td>
						</tr>
						<tr *ngIf="dataTable.data().length===0">
							<td colspan="6">Không có bản ghi nào.</td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="admin-wrap-table__foot">
				<div class="d-flex justify-content-center align-items-center w-100">
					<ictu-paginator [control]="dataTable.paginator" (onChangePage)="onChangePage($event)"></ictu-paginator>
				</div>
			</div>
		</div>
	</div>
	<div *ngIf="state() === 'loading';" class="dashboard-component--full-height dashboard-component__loading">
		<div class="dashboard-component__loading__content">
			<h4 class="dashboard-component__loading__heading">Loading...</h4>
			<mat-progress-bar mode="indeterminate" value="40"></mat-progress-bar>
		</div>
	</div>
</section>

<ng-template #inActiveTpl>
	<span class="ictu-badge ictu-badge--secondary">Chưa kích hoạt</span>
</ng-template>
<ng-template #errorTemplate>
	<div class="admin-table__alert-danger text-center w-100">Tải dữ liệu thất bại. Vui lòng chọn
		<a (click)="reload($event)" href="javascript:" class="admin-table__alert-danger__btn-reload">tải lại</a>
	</div>
</ng-template>

		<h2 class="ictu-p-drawer__heading">

				</g>
			</svg>
			{{ formControl.heading() }}
		</h2>
	</ng-template>
	<div *ngIf="formControl.enableLoading()" class="ictu-p-drawer__animations animation-typing-dots">
		<span class="animation-typing-dots__element"></span> <span class="animation-typing-dots__element"></span>
		<span class="animation-typing-dots__element"></span>
	</div>
	<div class="ictu-p-drawer__body">
		<div class="ovic-vertical__inputs ovic-vertical__inputs--layout-2 p-0">
			<form [formGroup]="this.formControl.formGroup">
				<div class="row">
					<div class="col-12">
						<p class="form-row">
							<label for="name">Tên môn học<span class="ovic-mark">*</span></label>
							<input id="name" pInputText type="text" placeholder="Nhập môn học" formControlName="name"/>
						</p>
					</div>
				</div>
				<div class="row">
					<div class="col-12">
						<p class="form-row">
							<label for="slug">Ký hiệu môn học<span class="ovic-mark">*</span></label>
							<span class="d-block position-relative width">
								<input id="slug" pInputText type="text" placeholder="Ký hiệu môn học" formControlName="slug"/>
								<span *ngIf="formField('slug').pending" style="position: absolute;top: 1px;left: 1px;width: calc(100% - 2px);height: calc(100% - 2px);z-index: 1;background-color: #ffffff75;border-radius: 4px;display: flex;justify-content: flex-end;align-items: center;">
									<i class="pi pi-spin pi-spinner" style="width: auto;font-size: 14px;aspect-ratio: 1;display: inline-flex;justify-content: center;align-items: center;border-radius: 999px;height: 100%;"></i>
								</span>
							</span>
							<small *ngIf="formField('slug').invalid && formField('slug').errors['slugExists']" style="color: #e31506;line-height: 1.5;margin: 0;display: block;font-size: 12px;position: absolute;z-index: 1;top: 100%;left: 0;padding: 2px 0 0;">Ký hiệu đã tồn tại </small>
						</p>
					</div>
				</div>
				<div class="row">
					<div class="col-12">
						<p class="form-row">
							<label for="desc">Mô tả</label>
							<textarea pInputTextarea placeholder="Mô tả cho môn học..." id="desc" cols="30" rows="2" formControlName="desc"></textarea>
						</p>
					</div>
				</div>
				<div class="row">
					<div class="col-12">
						<p class="form-row">
							<label class="ictu-form__label">Trạng thái</label>
							<p-dropdown [options]="optionStates" appendTo="body" class="ictu-dropdown-style" panelStyleClass="ictu-dropdown-panel" formControlName="status" placeholder="Trạng thái"></p-dropdown>
						</p>
					</div>
				</div>
			</form>
		</div>
	</div>
	<div class="ictu-p-drawer__footer">
		<button (click)="formControl.closeForm()" class="btn ictu-badge-btn--secondary" mat-flat-button>Hủy</button>
		<button (click)="submitForm()" [disabled]="!formControl.formFilledAndValid" class="btn ictu-badge-btn--primary-reverse" mat-flat-button>Lưu lại</button>
	</div>
</p-sidebar>
