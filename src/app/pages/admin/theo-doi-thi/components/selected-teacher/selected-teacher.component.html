<div id="select-teacher">
    <div class="mt-2 mb-2 d-flex align-items-center justify-content-center" *ngIf="listTeachers.length > 0" >
        <div class="search-block__elm">
          <span class="p-input-icon-right" style="min-width: 50%">
            <i class="pi pi-search"></i>
            <input
              style="width: 100%; height: 36px"
              class="ovic-table-search--head datatable-input"
              type="text"
              pInputText
              placeholder="Nhập tên giảng viên ..."
              (input)="changeSearchInput($event.target['value'])"
            />
          </span>
        </div>
        <div class="ml-2">
          <p-dropdown
            [options]="listRooms"
            [(ngModel)]="roomSelected"
            optionLabel="room"
            placeholder="Chọn phòng thi"
          />
        </div>
      </div>
      <div
        class="ovic-side-navigation-content__body ovic-scroll-style p-0 max-height"
        [class.ictu-is-loading]="isLoading"
        *ngIf="listTeachers.length > 0; else teacherEmpty"
      >
        <p-table
          [value]="listTeachers"
          [tableStyle]="{ 'min-width': '50rem' }"
          [(selection)]="listTeachersSelected"
        >
          <ng-template pTemplate="header">
            <tr>
              <th><p-tableHeaderCheckbox></p-tableHeaderCheckbox></th>
              <th>STT</th>
              <th>Họ tên</th>
              <th>Email</th>
              <th>SDT</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-item>
            <tr class="intro-y">
              <td><p-tableCheckbox [value]="item"></p-tableCheckbox></td>
              <td>{{ item.__index_table }}</td>
              <td>{{ item.display_name }}</td>
              <td>{{ item.email }}</td>
              <td>{{ item.phone }}</td>
            </tr>
          </ng-template>
        </p-table>
  
        <div *ngIf="listTeachers.length > 0" class="page-layout-set">
          <p-paginator
            [rows]="30"
            [totalRecords]="recordsTotal"
            [pageLinkSize]="5"
            (onPageChange)="paginateTeacher($event)"
          >
          </p-paginator>
        </div>
      </div>
      <div class="ovic-side-navigation-content__foot" *ngIf="listTeachers.length > 0">
        <!-- <span class="ovic-side-navigation-content__foot__notice mr-auto">
          <mark>(*)</mark> bắt buộc phải nhập
        </span> -->
        <button
          pButton
          pRipple
          [label]="'Lưu lại'"
          icon="pi pi-save"
          [disabled]="checkAddTeacherNotValid()"
          (click)="saveSelection()"
          class="p-button-success"
        ></button>
        <button
          pButton
          pRipple
          label="Đóng"
          class="p-button-secondary ml-3"
          icon="pi pi-times"
          (click)="closeDialog()"
        ></button>
      </div>

      <ng-template #teacherEmpty>
        <div>
          <div id="teacherEmpty" >
            <div class="w-100 h-100 d-flex align-items-center justify-content-center">
              <div class="d-flex align-items-center flex-column">
                <div class="title">
                  <img style="width: 50px; height: 50px;" src="/assets/images/animation/wired-outline-12-layers-hover-slide.gif" alt=""> 
                  <b class="ml-2" style="font-size: 1rem;">Không có giảng viên nào rảnh</b>
                </div>
              </div>
      
            </div>
        </div>
        </div>
      </ng-template>
</div>
