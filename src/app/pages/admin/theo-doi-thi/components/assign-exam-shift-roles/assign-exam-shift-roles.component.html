<div id="app-assign-exam-shift-roles">
  <div class="table-header">
    <div
      class="title d-flex align-items-center justify-content-between mb-2 mt-2 ml-2 mr-2"
    >
      <div class="title-left mb-2">
        <b>Danh sách giảng viên</b>
      </div>

      <div class="">
        <div class="d-flex w-100 justify-content-end">
          <div class="mr-2">
            <p-dropdown
            [options]="listRooms"
            [(ngModel)]="roomSelected"
            [showClear]="true"
            (onChange)="changeRoomSelected()"
            optionLabel="room"
            placeholder="Chọn phòng thi"
          />
          </div>
          <div>
            <p-button
            (onClick)="btnAssignExamShiftRoles()"
            severity="success"
            icon="pi pi-plus"
            label="Chọn giảng viên"
          />
          </div>
         
        </div>
      </div>
    </div>
  </div>

  <div class="body mt-2" *ngIf="listTeachers.length > 0">
    <div
      class="ovic-side-navigation-content__body ovic-scroll-style p-0 max-height"
      [class.ictu-is-loading]="isLoading"
    >
      <p-table [value]="listTeachers" [(selection)]="listTeachersSelected">
        <ng-template pTemplate="header">
          <tr>
            <th><p-tableHeaderCheckbox></p-tableHeaderCheckbox></th>
            <th>STT</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>SDT</th>
            <th>Phòng</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
          <tr class="intro-y">
            <td><p-tableCheckbox [value]="item"></p-tableCheckbox></td>
            <td>{{ item.__index_table }}</td>
            <td>{{ item.display_name }}</td>
            <td>{{ item.email }}</td>
            <td>{{ item.phone }}</td>
            <td>{{ item?.room?.room }}</td>
          </tr>
        </ng-template>
      </p-table>


      <div class="page-layout-set">
        <p-paginator
          [rows]="30"
          [totalRecords]="recordsTotal"
          [pageLinkSize]="5"
          (onPageChange)="paginate($event)"
        >
        </p-paginator>
      </div>
    </div>
  </div>
</div>

<ng-template #templateAddTeacher>
  <div class="ovic-side-navigation-content">
    <div class="ovic-side-navigation-content__head">
      <h4 class="ovic-side-navigation-content__head__title">
        Danh sách giảng viên
      </h4>
      <button
        pButton
        pRipple
        (click)="closeDialogByName('addTeacher')"
        type="button"
        icon="pi pi-times"
        class="p-button-rounded p-button-danger p-button-text close ovic-side-navigation-content__head__btn-close"
      ></button>
    </div>
    
    <app-selected-teacher [listRooms]="listRooms" (closeDialogByName)="closeDialogByName($event)" [triggerChange]="triggerForChilden"></app-selected-teacher>

    
  </div>
</ng-template>
