<div class="tabler-icon-wrapper">
	<div class="row">
		<div class="col-12">
			<div class="icon-tabler">
				<div class="icon-tabler__head">
					<div class="icon-tabler__head__search-wrap">
						<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="7"></circle><line x1="21" x2="15" y1="21" y2="15"></line></svg>
						<input [(ngModel)]="search" (ngModelChange)="triggerSearch()" pInputText placeholder="Search here" type="text">
					</div>
				</div>
				<div class="icon-tabler__body">
					<h3 class="icon-tabler__body__title">{{ bodyHeading() }}</h3>
					<div class="icon-tabler__body__items">
						<ng-container *ngIf="icons().length; else emptyTpl">
							<button *ngFor="let icon of icons()" class="icon-tabler__body__items__btn" (click)="copyIcon(icon)" mat-button [matTooltip]="icon" matTooltipPosition="above">
								<i class="ti" [ngClass]="icon"></i>
							</button>
						</ng-container>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>

<ng-template #emptyTpl>
	<div class="text-center py-6 text-secondary icon-tabler__body__empty">
		<h3 class="icon-tabler__body__empty__heading">Can't find what you're looking for?</h3>
		<p class="icon-tabler__body__empty__desc">We're happy to add new icons, as soon as possible. Feel free to request new icons on Twitter.</p>
	</div>
</ng-template>
