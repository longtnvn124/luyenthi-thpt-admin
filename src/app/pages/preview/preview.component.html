<div class="components-sample__heading d-block">
	<div class="d-flex justify-content-center align-items-center" style="height: 60px">
		<div class="components-sample__heading__menu">
			<button (click)="collapseMenu.panel?.toggle()" pButton pRipple class="p-button-rounded" icon="pi pi-bars"></button>
			<div class="components-sample__heading__menu__list">
				<collapse-panel #collapseMenu>
					<nav class="d-flex justify-content-start align-items-start">
						<a *ngFor="let item of menuList" (click)="collapseMenu.panel?.hide()" href="#" [routerLink]="item.routerLink" routerLinkActive="--nav-active">{{ item.label }}</a>
					</nav>
				</collapse-panel>
			</div>
		</div>
		<div *ngIf="heading().heading" class="components-sample__heading__wrap-text flex-fill text-center">
			<h4 class="components-sample__heading__text text-center">{{ heading().heading }}</h4>
			<p *ngIf="heading().description" class="components-sample__heading__text__desc">{{ heading().description }}</p>
		</div>
	</div>
</div>
<div class="components-sample-layout p-25 position-relative">
	<router-outlet></router-outlet>
</div>
