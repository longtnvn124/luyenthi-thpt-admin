<div class="modal-body ovic-modal-body">
	<div class="w-100">
		<div *ngIf="percent <= 100">
			<div class="progress-container">
				<div class="progress-bar" [style.width.%]="percent"></div>
			</div>
			<div class="d-flex justify-content-center align-items-center content-label">
				<i style="font-size: 0.8rem;" class="pi pi-spin pi-sync"></i> <span class="ml-2">Đang xử lý. Vui lòng chờ... <span class="progress-label">{{ percent }}%</span></span>
			</div>
		</div>
		<div *ngIf="percent >= 101">
			<div class="success-container">
				<div class="checkmark"></div>
				<div class="message">Thành công!</div>
			</div>
			<div class="d-flex justify-content-center">
				<button (click)="confirm(true)" class="btn-close-custom">Xác nhận</button>
			</div>
		</div>
	</div>
</div>
